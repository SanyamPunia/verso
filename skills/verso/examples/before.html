<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Project settings</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" />
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: Inter, system-ui, sans-serif; background: #f4f5f7; color: #111827; }
  .wrap { max-width: 880px; margin: 0 auto; padding: 40px 20px; }
  .card { background: #fff; border: 1px solid #e5e7eb; border-radius: 14px; box-shadow: 0 8px 24px rgba(17,24,39,.06); padding: 28px; }
  .head { display: flex; align-items: center; gap: 14px; }
  .logo { width: 44px; height: 44px; border-radius: 10px; background: #2563eb; color: #fff; display: grid; place-items: center; font-weight: 600; }
  h1 { font-size: 22px; margin: 0; }
  .sub { color: #6b7280; font-size: 14px; margin: 2px 0 0; }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin: 24px 0; }
  .stat { border: 1px solid #e5e7eb; border-radius: 10px; padding: 14px; }
  .stat b { display: block; font-size: 22px; }
  .stat span { color: #6b7280; font-size: 13px; }
  h2 { font-size: 15px; margin: 24px 0 12px; }
  label { display: block; font-size: 13px; font-weight: 500; margin: 14px 0 6px; }
  input[type=text], textarea { width: 100%; border: 1px solid #d1d5db; border-radius: 8px; padding: 10px 12px; font: inherit; font-size: 14px; }
  textarea { min-height: 80px; }
  .check { display: flex; align-items: center; gap: 8px; margin-top: 14px; font-size: 14px; }
  ul { list-style: none; padding: 0; margin: 0; }
  li { display: flex; align-items: center; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #f0f1f3; font-size: 14px; }
  .badge { font-size: 12px; background: #eff6ff; color: #1d4ed8; padding: 2px 10px; border-radius: 999px; }
  .row { display: flex; gap: 10px; justify-content: flex-end; margin-top: 24px; }
  button { font: inherit; font-size: 14px; border-radius: 8px; padding: 9px 16px; border: 1px solid #d1d5db; background: #fff; cursor: pointer; }
  .primary { background: #2563eb; border-color: #2563eb; color: #fff; }
  .danger { margin-top: 24px; border: 1px solid #fecaca; background: #fef2f2; border-radius: 10px; padding: 16px; display: flex; justify-content: space-between; align-items: center; gap: 12px; }
  .danger p { margin: 0; font-size: 14px; color: #991b1b; }
  .danger button { border-color: #fca5a5; color: #b91c1c; }
  @media (max-width: 600px) { .stats { grid-template-columns: 1fr; } }
</style>
</head>
<body>
  <main class="wrap">
    <section class="card" aria-labelledby="title">
      <header class="head">
        <div class="logo" aria-hidden="true">A</div>
        <div>
          <h1 id="title">Atlas</h1>
          <p class="sub">Project settings, last deployed 2 hours ago</p>
        </div>
      </header>

      <div class="stats">
        <div class="stat"><b>128</b><span>Deploys this month</span></div>
        <div class="stat"><b>99.98%</b><span>Uptime</span></div>
        <div class="stat"><b>42s</b><span>Average build</span></div>
      </div>

      <h2>General</h2>
      <label for="name">Project name</label>
      <input id="name" type="text" value="Atlas" />
      <label for="desc">Description</label>
      <textarea id="desc" placeholder="What is this project for?"></textarea>
      <label class="check"><input type="checkbox" checked /> Deploy every push to main</label>

      <h2>Members</h2>
      <ul>
        <li>Sanyam Punia <span class="badge">Owner</span></li>
        <li>Ada Lovelace <span class="badge">Admin</span></li>
        <li>Luca Pacioli <span class="badge">Viewer</span></li>
      </ul>

      <div class="row">
        <button type="button">Cancel</button>
        <button type="button" class="primary">Save changes</button>
      </div>

      <div class="danger">
        <p>Deleting this project removes every deploy. This cannot be undone.</p>
        <button type="button">Delete project</button>
      </div>
    </section>
  </main>
</body>
</html>
