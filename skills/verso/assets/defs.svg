<!--
  Mount this once in the document, before any .ms-scope content. In React,
  render it as a component at the root of the themed portion.
  Every filter is displacement or blur only, so it never changes a colour.
-->
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <defs>
    <!-- Roughens a glyph or a sketch line by a fraction of a pixel: the quill. -->
    <filter id="ms-ink" x="-2%" y="-10%" width="104%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="1" seed="3" result="n" />
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.1" xChannelSelector="R" yChannelSelector="G" />
    </filter>

    <!-- Bends a long ruled line so it reads as drawn freehand. -->
    <filter id="ms-line" x="-4%" y="-8%" width="108%" height="116%">
      <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="11" result="n" />
      <feDisplacementMap in="SourceGraphic" in2="n" scale="3.2" xChannelSelector="R" yChannelSelector="G" />
    </filter>

    <!-- Tears the edge of a sheet of rag paper. -->
    <filter id="ms-deckle" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.05" numOctaves="4" seed="2" result="n" />
      <feDisplacementMap in="SourceGraphic" in2="n" scale="9" xChannelSelector="R" yChannelSelector="G" />
    </filter>

    <!-- Lets a brush wash bleed unevenly into the fibres. -->
    <filter id="ms-wash" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="3" seed="5" result="n" />
      <feDisplacementMap in="SourceGraphic" in2="n" scale="22" xChannelSelector="R" yChannelSelector="G" result="d" />
      <feGaussianBlur in="d" stdDeviation="1.4" />
    </filter>
  </defs>
</svg>
